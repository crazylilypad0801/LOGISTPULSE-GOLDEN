name: LOGISTPULSE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


jobs:

  architecture-contract:

    name: Architecture contract
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Validate required platform assets
        run: |

          echo "Validating LOGISTPULSE architecture..."

          test -f compose.yaml
          test -f .devcontainer/Dockerfile

          test -f observability/compose.yaml
          test -f observability/prometheus.yml

          for service in \
            inventory-api \
            logistics-api \
            operations-api \
            fulfillment-api
          do

            test -f services/$service/app.py
            test -f services/$service/routes.py
            test -f services/$service/repository.py

          done

          test -f services/operations-api/telemetry.py
          test -f scripts/smoke-orders.sh

          echo "Architecture contract OK"


      - name: Validate Docker Compose
        run: |

          docker compose config --quiet

          docker compose \
            -f observability/compose.yaml \
            config --quiet

          echo "Compose definitions OK"



  integration:

    name: Build, integration and observability

    runs-on: ubuntu-latest

    needs:
      - architecture-contract


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Build LOGISTPULSE
        run: |

          docker compose build


      - name: Start LOGISTPULSE
        run: |

          docker compose up -d

          echo
          echo "Initial container state:"
          docker compose ps


      - name: Platform readiness gate
        run: |

          echo "Waiting for LOGISTPULSE platform readiness..."

          READY=false

          for i in $(seq 1 60); do

            INVENTORY=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/inventory || true)

            LOGISTICS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/logistics || true)

            OPERATIONS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/operations || true)

            FULFILLMENT=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/health/fulfillment || true)


            echo \
              "Attempt $i/60:" \
              "inventory=$INVENTORY" \
              "logistics=$LOGISTICS" \
              "operations=$OPERATIONS" \
              "fulfillment=$FULFILLMENT"


            if [ "$INVENTORY" = "200" ] && \
               [ "$LOGISTICS" = "200" ] && \
               [ "$OPERATIONS" = "200" ] && \
               [ "$FULFILLMENT" = "200" ]; then

              READY=true

              echo
              echo "LOGISTPULSE PLATFORM READY"

              break

            fi


            sleep 3

          done


          if [ "$READY" != "true" ]; then

            echo
            echo "ERROR: LOGISTPULSE did not become ready"

            docker compose ps -a

            exit 1

          fi


      - name: Domain and regression smoke tests
        run: |

          bash scripts/smoke.sh
          bash scripts/smoke-orders.sh


      - name: Start observability control plane
        run: |

          docker compose \
            -f observability/compose.yaml \
            up -d prometheus grafana


      - name: Validate Prometheus
        run: |

          echo "Waiting for Prometheus..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://localhost:9090/-/ready \
              > /dev/null 2>&1; then

              echo "Prometheus READY"
              break

            fi

            sleep 2

          done


          curl -fsS \
            http://localhost:9090/-/ready


      - name: Validate Grafana
        run: |

          echo "Waiting for Grafana..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://localhost:3000/api/health \
              > /dev/null 2>&1; then

              echo "Grafana READY"
              break

            fi

            sleep 2

          done


          curl -fsS \
            http://localhost:3000/api/health \
            | grep -q "ok"


      - name: Diagnostic evidence on failure
        if: failure()

        run: |

          echo
          echo "======================================"
          echo " CONTAINER STATUS"
          echo "======================================"

          docker compose ps -a || true


          echo
          echo "======================================"
          echo " APPLICATION LOGS"
          echo "======================================"

          docker compose logs \
            --tail=250 || true


          echo
          echo "======================================"
          echo " OBSERVABILITY LOGS"
          echo "======================================"

          docker compose \
            -f observability/compose.yaml \
            logs --tail=100 || true


      - name: Stop observability
        if: always()

        run: |

          docker compose \
            -f observability/compose.yaml \
            down || true


      - name: Stop LOGISTPULSE
        if: always()

        run: |

          docker compose down -v || true
