server {
  listen 8080;
  resolver 127.0.0.11 valid=1s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;
  location /api/inventory/ { set $backend inventory-api:8000; proxy_pass http://$backend$request_uri; }
  location /api/distribution/ { set $backend logistics-api:8000; proxy_pass http://$backend$request_uri; }
  location /api/operations/ { set $backend operations-api:8000; proxy_pass http://$backend$request_uri; }
  location /api/fulfillment/ { set $backend fulfillment-api:8000; proxy_pass http://$backend$request_uri; }
  location /health/inventory { set $backend inventory-api:8000; proxy_pass http://$backend/health; }
  location /health/logistics { set $backend logistics-api:8000; proxy_pass http://$backend/health; }
  location /health/operations { set $backend operations-api:8000; proxy_pass http://$backend/health; }
  location /health/fulfillment { set $backend fulfillment-api:8000; proxy_pass http://$backend/health; }
}
